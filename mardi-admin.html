<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · Mardi Idéal · Yely</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap">
<style>
:root {
  --bg:#0d0b10; --surface:#17121f; --surface2:#211a2e; --border:#2e2440;
  --accent:#c4a0d4; --gold:#dbb96a; --text:#f0eaf6; --text2:#a094b0; --text3:#6a5f7a;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; padding:28px 20px; padding-bottom:40px; max-width:640px; margin:0 auto; }
h1 { font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:300; margin-bottom:4px; }
.sub { font-size:13px; color:var(--text3); margin-bottom:32px; }

/* Login */
#login { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; gap:16px; }
.logo { font-family:'Cormorant Garamond',serif; font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
.pw-input { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:14px 18px; color:var(--text); font-size:16px; width:100%; max-width:300px; text-align:center; letter-spacing:.15em; }
.pw-input:focus { outline:none; border-color:var(--accent); }
.btn-login { background:linear-gradient(135deg,var(--accent),#9b70be); color:#fff; border:none; border-radius:40px; padding:13px 32px; font-size:15px; font-weight:500; cursor:pointer; font-family:inherit; }
.err { color:#e87a7a; font-size:13px; min-height:18px; }

/* Stats */
.stat-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:28px; }
.stat { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
.stat-n { font-family:'Cormorant Garamond',serif; font-size:40px; font-weight:300; color:var(--accent); line-height:1; font-variant-numeric:tabular-nums; }
.stat-l { font-size:12px; color:var(--text2); margin-top:4px; }

/* Bars */
.section-title { font-size:11px; font-weight:500; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); margin-bottom:14px; }
.bars { display:flex; flex-direction:column; gap:9px; margin-bottom:32px; }
.bar-row { display:flex; align-items:center; gap:10px; }
.bar-name { font-size:12px; color:var(--text2); width:180px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-track { flex:1; background:var(--surface); border-radius:4px; height:8px; }
.bar-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:4px; }
.bar-count { font-size:12px; color:var(--text3); width:24px; text-align:right; font-variant-numeric:tabular-nums; }

/* Cards */
.cards { display:flex; flex-direction:column; gap:12px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
.card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.card-who { font-size:14px; font-weight:500; }
.card-date { font-size:11px; color:var(--text3); }
.course-row { font-size:13px; color:var(--text2); padding:4px 0; display:flex; justify-content:space-between; }
.course-slot { font-size:12px; color:var(--accent); }
.extra { font-size:12px; color:var(--text3); font-style:italic; margin-top:8px; border-top:1px solid var(--border); padding-top:8px; }

.loading { text-align:center; padding:60px; color:var(--text3); }
.empty { text-align:center; padding:60px; color:var(--text3); font-size:14px; }
</style>
</head>
<body>

<div id="login">
  <div class="logo">Yely in the Air</div>
  <h1 style="font-size:28px;margin-bottom:4px">Admin · Mardi Idéal</h1>
  <p style="font-size:13px;color:var(--text3);margin-bottom:20px">Accès réservé</p>
  <input class="pw-input" id="pw" type="password" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')login()">
  <button class="btn-login" onclick="login()">Entrer</button>
  <p class="err" id="err"></p>
</div>

<div id="dashboard" hidden>
  <p style="font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:8px">Yely in the Air</p>
  <h1>Mardi Idéal</h1>
  <p class="sub" id="last-refresh"></p>

  <div class="stat-row">
    <div class="stat"><div class="stat-n" id="s-total">—</div><div class="stat-l">réponses</div></div>
    <div class="stat"><div class="stat-n" id="s-courses">—</div><div class="stat-l">cours différents</div></div>
    <div class="stat"><div class="stat-n" id="s-insta">—</div><div class="stat-l">avec Instagram</div></div>
  </div>

  <div class="section-title">Cours les plus demandés</div>
  <div class="bars" id="bars"></div>

  <div class="section-title">Toutes les réponses</div>
  <div class="cards" id="cards"></div>
</div>

<script>
const API = 'https://xayixasuyuranscustyw.supabase.co/functions/v1/get-mardi-submissions';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhheWl4YXN1eXVyYW5zY3VzdHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2MjIwMTIsImV4cCI6MjA5ODE5ODAxMn0.Kp_cJd5YMtbFZnUvUhd-4wMf0enjcBWsGzjwQSnAPP4';
let savedPassword = '';
try { savedPassword = sessionStorage.getItem('mardi_pw') || ''; } catch(e) {}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function login() {
  const pw = document.getElementById('pw').value.trim();
  if (!pw) return;
  document.getElementById('err').textContent = '';
  try {
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON}, body: JSON.stringify({ password: pw }) });
    const json = await res.json();
    if (!res.ok) {
      const msg = json.error || json.message || `Erreur ${res.status}`;
      document.getElementById('err').textContent = msg.includes('mardi_submissions')
        ? '⚠ La table n\'existe pas encore — lance le SQL dans le dashboard Supabase.'
        : msg;
      return;
    }
    savedPassword = pw;
    try { sessionStorage.setItem('mardi_pw', pw); } catch(e) {}
    showDashboard(json.data || []);
  } catch(e) {
    document.getElementById('err').textContent = 'Impossible de contacter le serveur.';
  }
}

async function refresh() {
  try {
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON}, body: JSON.stringify({ password: savedPassword }) });
    const json = await res.json();
    if (res.ok) showDashboard(json.data || []);
  } catch(e) {}
}

function showDashboard(data) {
  document.getElementById('login').hidden = true;
  document.getElementById('dashboard').hidden = false;

  document.getElementById('last-refresh').textContent =
    `${data.length} réponse${data.length!==1?'s':''} · mis à jour à ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`;

  // Stats
  document.getElementById('s-total').textContent = data.length;
  const tally = {};
  let withInsta = 0;
  data.forEach(d => {
    if (d.instagram) withInsta++;
    (d.courses||[]).forEach(c => { tally[c.name] = (tally[c.name]||0)+1; });
  });
  document.getElementById('s-courses').textContent = Object.keys(tally).length;
  document.getElementById('s-insta').textContent = withInsta;

  // Bars
  const sorted = Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  const maxV = sorted[0]?.[1]||1;
  document.getElementById('bars').innerHTML = sorted.map(([name,count]) => `
    <div class="bar-row">
      <span class="bar-name" title="${esc(name)}">${esc(name)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/maxV*100)}%"></div></div>
      <span class="bar-count">${count}</span>
    </div>`).join('');

  // Cards
  document.getElementById('cards').innerHTML = data.length === 0
    ? '<div class="empty">Aucune réponse pour l\'instant.</div>'
    : data.map(d => {
        const who = [d.name, d.instagram ? '@'+d.instagram.replace(/^@/,'') : ''].filter(Boolean).join(' · ') || 'Anonyme';
        const date = d.created_at ? new Date(d.created_at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
        const courses = (d.courses||[]).map(c => `
          <div class="course-row">
            <span>${c.emoji||''} ${esc(c.name)}</span>
            ${c.slot ? `<span class="course-slot">${esc(c.slot)}</span>` : ''}
          </div>`).join('');
        const extra = d.extra ? `<div class="extra">« ${esc(d.extra)} »</div>` : '';
        return `<div class="card">
          <div class="card-head"><span class="card-who">${esc(who)}</span><span class="card-date">${esc(date)}</span></div>
          ${courses}${extra}
        </div>`;
      }).join('');
}

// Auto-login si mot de passe en session
if (savedPassword) {
  document.getElementById('pw').value = savedPassword;
  login();
}
</script>
</body>
</html>
