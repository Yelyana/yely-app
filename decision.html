<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#3D1554">
<title>Décision à prendre — Yely</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #faf8ff; color: #1a0a2e; min-height: 100vh; padding: 0 0 40px; }
  .hero { background: linear-gradient(135deg, #3D1554, #7B4FA6); padding: 34px 20px 26px; text-align: center; }
  .hero small { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #e8c9f5; margin-bottom: 8px; }
  .hero h1 { font-size: 30px; font-weight: 800; color: #fff; line-height: 1.15; }
  .wrap { max-width: 520px; margin: -14px auto 0; padding: 0 16px; }
  .card { background: #fff; border-radius: 18px; padding: 24px 20px; box-shadow: 0 2px 18px rgba(100,60,160,.1); }
  .title { font-size: 20px; font-weight: 700; color: #3D1554; line-height: 1.3; margin-bottom: 12px; }
  .details { font-size: 15px; color: #3d2d5a; line-height: 1.65; margin-bottom: 22px; white-space: pre-line; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 18px 16px; font-size: 18px; font-weight: 700; font-family: inherit; cursor: pointer; margin-bottom: 12px; color: #fff; background: linear-gradient(135deg, #3D1554, #7B4FA6); }
  .btn.alt { background: #fff; color: #3D1554; border: 2px solid #c9b6e0; }
  .btn:disabled { opacity: .55; }
  .state { text-align: center; padding: 10px 0; }
  .state .emoji { font-size: 44px; margin-bottom: 10px; }
  .state .big { font-size: 20px; font-weight: 700; color: #3D1554; margin-bottom: 8px; }
  .state p { font-size: 15px; color: #3d2d5a; line-height: 1.6; margin-top: 6px; }
  .confirm { background: #f3ecfa; border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #3D1554; margin-bottom: 14px; text-align: center; }
  .foot { text-align: center; font-size: 12px; color: #9a8cb0; margin-top: 18px; }
</style>
</head>
<body>
<div class="hero"><small>Assistante Yely</small><h1>Décision à prendre</h1></div>
<div class="wrap"><div class="card" id="card"><div class="state"><div class="emoji">⏳</div><p>Chargement…</p></div></div>
<div class="foot">Yely in the Air · lien personnel, ne le partage pas</div></div>

<script>
const API = 'https://xayixasuyuranscustyw.supabase.co/functions/v1/assistant-decision';
const t = new URLSearchParams(location.search).get('t') || '';
const card = document.getElementById('card');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let current = null;

async function call(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return { status: r.status, data: await r.json().catch(() => ({})) };
}

function state(emoji, big, lines) {
  card.innerHTML = `<div class="state"><div class="emoji">${emoji}</div><div class="big">${esc(big)}</div>${(lines || []).map(l => `<p>${esc(l)}</p>`).join('')}</div>`;
}

function render(d) {
  current = d;
  if (d.status === 'answered') {
    const label = (d.options.find(o => o.key === d.answer) || {}).label || d.answer;
    return state('✅', 'Déjà répondu', [d.title, 'Ta réponse : ' + label, d.exec_note || '']);
  }
  if (d.status === 'expired') return state('⌛', 'Cette décision a expiré', [d.title, 'Aucune action n\'a été faite, rien n\'a changé.']);
  card.innerHTML = `
    <div class="title">${esc(d.title)}</div>
    <div class="details">${esc(d.details || '')}</div>
    <div id="opts">${d.options.map((o, i) => `<button class="btn ${i > 0 ? 'alt' : ''}" data-k="${esc(o.key)}">${esc(o.label)}</button>`).join('')}</div>`;
  card.querySelectorAll('button[data-k]').forEach(b => b.addEventListener('click', () => ask(b.dataset.k)));
}

// Deuxième tape pour éviter une réponse par erreur
function ask(key) {
  const opt = current.options.find(o => o.key === key);
  card.querySelector('#opts').innerHTML = `
    <div class="confirm">Tu confirmes : <strong>${esc(opt.label)}</strong> ?</div>
    <button class="btn" id="yes">Oui, je confirme</button>
    <button class="btn alt" id="no">Non, retour</button>`;
  document.getElementById('yes').onclick = () => send(key);
  document.getElementById('no').onclick = () => render(current);
}

async function send(key) {
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  const { status, data } = await call({ op: 'answer', t, answer: key });
  if (data.ok) return state('✅', 'C\'est enregistré', [data.label, ...(data.notes || []), 'Tu recevras un mail quand tout est terminé.']);
  if (status === 409) return render({ ...current, ...data });
  state('⚠️', 'Oups', ['Je n\'ai pas pu enregistrer ta réponse. Réessaie dans un instant.']);
}

(async () => {
  if (!t) return state('⚠️', 'Lien incomplet', ['Ouvre la page depuis le bouton du mail.']);
  const { status, data } = await call({ op: 'get', t });
  if (status !== 200) return state('⚠️', 'Lien invalide', ['Ouvre la page depuis le bouton du mail le plus récent.']);
  render(data);
})();
</script>
</body>
</html>
