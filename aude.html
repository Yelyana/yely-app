<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aude · Soins Bien-être — Yely in the Air</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #0f0d16; --bg2: #17141f; --card: #1c1826;
  --violet: #9b7ddb; --violet-light: #c4a8f5; --violet-dark: #3d2f62;
  --text: #f0ecfa; --text2: #b8b0cc; --text3: #8a829a;
  --border: rgba(155,125,219,.18); --green: #a3e635;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: "DM Sans", system-ui, sans-serif; font-weight: 300; line-height: 1.6; min-height: 100dvh; }
.wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px max(40px, env(safe-area-inset-bottom)); }
.header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--violet-dark); border: 1.5px solid var(--violet); display: flex; align-items: center; justify-content: center; font-family: "Cormorant Garamond", serif; font-size: 22px; font-style: italic; color: var(--violet-light); flex-shrink: 0; }
.header-text h1 { font-family: "Cormorant Garamond", serif; font-size: 26px; font-weight: 300; color: var(--violet-light); }
.header-text p { font-size: 12px; color: var(--text3); margin-top: 2px; }
.month-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.month-nav button { background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text2); padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
.month-nav button:hover { border-color: var(--violet); color: var(--violet-light); }
.month-label { font-family: "Cormorant Garamond", serif; font-size: 22px; font-weight: 300; color: var(--text); flex: 1; }
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 28px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
.stat-val { font-family: "Cormorant Garamond", serif; font-size: 32px; font-weight: 300; color: var(--violet-light); line-height: 1; }
.stat-lbl { font-size: 11px; color: var(--text3); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }
.section-title { font-size: 10px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--text3); margin-bottom: 14px; }
.soin-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 14px; }
.soin-date { min-width: 56px; text-align: center; }
.soin-day { font-size: 22px; font-family: "Cormorant Garamond", serif; font-weight: 300; color: var(--violet-light); line-height: 1; }
.soin-month { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
.soin-body { flex: 1; }
.soin-name { font-size: 14px; font-weight: 500; color: var(--text); }
.soin-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
.soin-student { font-size: 13px; color: var(--text2); margin-top: 6px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 500; }
.badge-included { background: rgba(163,230,53,.12); color: var(--green); }
.badge-paid { background: rgba(155,125,219,.15); color: var(--violet-light); }
.empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
.invoice-block { background: var(--card); border: 1px solid rgba(163,230,53,.25); border-radius: 16px; padding: 22px; margin-top: 28px; }
.invoice-title { font-family: "Cormorant Garamond", serif; font-size: 20px; font-weight: 300; color: var(--green); margin-bottom: 16px; }
.invoice-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text2); }
.invoice-row:last-child { border-bottom: none; }
.invoice-total { font-size: 16px; font-weight: 500; color: var(--text); }
.invoice-total-val { font-family: "Cormorant Garamond", serif; font-size: 28px; color: var(--green); }
.spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--violet); border-radius: 50%; animation: spin .8s linear infinite; margin: 60px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="auth-screen" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;max-width:360px;width:100%;text-align:center">
    <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--violet-light);margin-bottom:6px">Aude</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:28px">Soins Bien-être · Yely in the Air</div>
    <input type="password" id="pwd-input" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')checkPwd()"
      style="width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;text-align:center;letter-spacing:0.1em;margin-bottom:12px">
    <div id="pwd-error" style="font-size:12px;color:#e87a7a;min-height:18px;margin-bottom:10px"></div>
    <button onclick="checkPwd()" style="width:100%;padding:12px;background:var(--violet-dark);border:1px solid var(--violet);border-radius:10px;color:var(--violet-light);font-size:14px;font-family:inherit;cursor:pointer">Accéder</button>
  </div>
</div>
<div class="wrap">
  <div class="header">
    <div class="avatar">A</div>
    <div class="header-text">
      <h1>Aude</h1>
      <p>Soins Bien-être · Yely in the Air · Mercredis 14h–19h</p>
    </div>
  </div>

  <div class="month-nav">
    <button onclick="changeMonth(-1)">←</button>
    <div class="month-label" id="month-label">…</div>
    <button onclick="changeMonth(1)">→</button>
  </div>

  <div id="content"><div class="spinner"></div></div>
</div>

<script>
const SUPABASE_URL = 'https://xayixasuyuranscustyw.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhheWl4YXN1eXVyYW5zY3VzdHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjYzMTIwOTAsImV4cCI6MjA0MTg4ODA5MH0.UPgfyZeVd0cJJu9LoVBTRx8tlNhYxL6lnlHKKjGJAP8';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const PWD_HASH = '8b4f2a9c3e1d7b6f0a5c8e2d4f1b9a3c'; // sha256-like placeholder, replaced below
const CORRECT = 'soins2026';
function checkPwd() {
  const val = document.getElementById('pwd-input').value;
  if (val === CORRECT) {
    document.getElementById('auth-screen').style.display = 'none';
    loadMonth();
  } else {
    document.getElementById('pwd-error').textContent = 'Mot de passe incorrect';
    document.getElementById('pwd-input').value = '';
    document.getElementById('pwd-input').focus();
  }
}

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth(); // 0-indexed

const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const SOIN_NAMES = { relaxant: 'Soin Relaxant', drainant_visage: 'Soin Drainant Visage' };
const SOIN_DESC = { relaxant: 'Réflexologie infrarouge · Massage crânien', drainant_visage: 'Réflexologie infrarouge · Drainage lymphatique' };

function pad(n) { return String(n).padStart(2, '0'); }

function changeMonth(d) {
  currentMonth += d;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  loadMonth();
}

async function loadMonth() {
  const start = `${currentYear}-${pad(currentMonth+1)}-01`;
  const endDate = new Date(currentYear, currentMonth+1, 1);
  const end = `${endDate.getFullYear()}-${pad(endDate.getMonth()+1)}-01`;

  document.getElementById('month-label').textContent = `${MONTHS_FR[currentMonth]} ${currentYear}`;
  document.getElementById('content').innerHTML = '<div class="spinner"></div>';

  const { data: soins, error } = await db
    .from('soin_appointments')
    .select('*')
    .gte('date', start)
    .lt('date', end)
    .eq('status', 'confirmed')
    .order('date')
    .order('start_time');

  if (error) {
    document.getElementById('content').innerHTML = `<div class="empty">Erreur : ${error.message}</div>`;
    return;
  }

  const list = soins || [];
  const paid = list.filter(s => !s.is_included);
  const included = list.filter(s => s.is_included);
  const totalCA = paid.length * 40;

  // Stats
  const statsHtml = `
    <div class="stats-row">
      <div class="stat"><div class="stat-val">${list.length}</div><div class="stat-lbl">Soins total</div></div>
      <div class="stat"><div class="stat-val">${paid.length}</div><div class="stat-lbl">Payants</div></div>
      <div class="stat"><div class="stat-val">${included.length}</div><div class="stat-lbl">Inclus abo</div></div>
    </div>`;

  // Cards
  let cardsHtml = '';
  if (list.length === 0) {
    cardsHtml = '<div class="empty">Aucun soin ce mois</div>';
  } else {
    const today = new Date().toISOString().slice(0,10);
    const upcoming = list.filter(s => s.date >= today);
    const past = list.filter(s => s.date < today);

    if (upcoming.length) {
      cardsHtml += `<div class="section-title" style="margin-top:4px">À venir</div>`;
      cardsHtml += upcoming.map(s => soinCard(s)).join('');
    }
    if (past.length) {
      cardsHtml += `<div class="section-title" style="margin-top:20px">Passés</div>`;
      cardsHtml += past.map(s => soinCard(s)).join('');
    }
  }

  // Invoice block
  const invoiceRows = paid.map(s => {
    const d = new Date(s.date);
    const label = `${d.getDate()} ${MONTHS_FR[d.getMonth()].slice(0,3)} · ${s.start_time?.slice(0,5)} · ${SOIN_NAMES[s.soin_type]||s.soin_type}`;
    return `<div class="invoice-row"><span>${label}</span><span>40 €</span></div>`;
  }).join('');

  const invoiceHtml = `
    <div class="invoice-block">
      <div class="invoice-title">🧾 Récapitulatif facturation</div>
      ${paid.length === 0
        ? '<div style="font-size:13px;color:var(--text3)">Aucun soin payant ce mois</div>'
        : `${invoiceRows}
           <div class="invoice-row" style="margin-top:8px">
             <span class="invoice-total">Total à facturer à Yely in the Air</span>
             <span class="invoice-total-val">${totalCA} €</span>
           </div>`}
      ${included.length ? `<div style="font-size:11px;color:var(--text3);margin-top:10px">${included.length} soin${included.length>1?'s':''} inclus dans abonnement — non facturé${included.length>1?'s':''}</div>` : ''}
    </div>`;

  document.getElementById('content').innerHTML = statsHtml + cardsHtml + invoiceHtml;
}

function soinCard(s) {
  const d = new Date(s.date);
  const day = d.getDate();
  const month = MONTHS_FR[d.getMonth()].slice(0,3).toLowerCase();
  const time = s.start_time?.slice(0,5) || '';
  const badge = s.is_included
    ? '<span class="badge badge-included">Inclus abo</span>'
    : '<span class="badge badge-paid">40 €</span>';
  return `
    <div class="soin-card">
      <div class="soin-date">
        <div class="soin-day">${day}</div>
        <div class="soin-month">${month}</div>
      </div>
      <div class="soin-body">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="soin-name">${SOIN_NAMES[s.soin_type]||s.soin_type}</span>
          ${badge}
        </div>
        <div class="soin-meta">${time} · 50 min · ${SOIN_DESC[s.soin_type]||''}</div>
        <div class="soin-student">👤 ${s.student_name}${s.student_phone ? ' · ' + s.student_phone : ''}</div>
        ${s.notes ? `<div style="font-size:11px;color:var(--text3);margin-top:6px;font-style:italic">${s.notes}</div>` : ''}
      </div>
    </div>`;
}

// loadMonth() appelé après auth seulement
</script>
</body>
</html>
