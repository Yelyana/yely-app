<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f0d16">
<title>Aude · Soins Bien-être — Yely in the Air</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500;700&display=swap">
<style>
:root {
  --bg: #0f0d16; --bg2: #17141f; --card: #1c1826;
  --violet: #9b7ddb; --violet-light: #c4a8f5; --violet-dark: #3d2f62;
  --pink: #e8a0bf; --pink-bg: rgba(232,160,191,.16);
  --text: #f0ecfa; --text2: #b8b0cc; --text3: #8a829a;
  --border: rgba(155,125,219,.18); --green: #a3e635;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: "DM Sans", system-ui, sans-serif; font-weight: 300; line-height: 1.6; min-height: 100dvh; }
.wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px max(110px, env(safe-area-inset-bottom)); }
.header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--violet-dark); border: 1.5px solid var(--violet); display: flex; align-items: center; justify-content: center; font-family: "Cormorant Garamond", serif; font-size: 22px; color: var(--violet-light); flex-shrink: 0; }
.header h1 { font-family: "Cormorant Garamond", serif; font-size: 26px; font-weight: 300; color: var(--violet-light); line-height: 1.1; }
.header p { font-size: 12px; color: var(--text3); }
.tabs { display: flex; gap: 8px; margin-bottom: 18px; }
.tab { flex: 1; padding: 12px 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text2); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
.tab.on { background: var(--violet-dark); border-color: var(--violet); color: #fff; }
.intro { font-size: 14px; color: var(--text2); line-height: 1.65; margin-bottom: 14px; }
.banner { background: rgba(232,160,191,.12); border: 1px solid rgba(232,160,191,.35); color: #f3c9dc; border-radius: 12px; padding: 11px 14px; font-size: 13px; line-height: 1.55; margin-bottom: 14px; }
.counts { display: flex; gap: 8px; margin-bottom: 16px; }
.count { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
.count b { display: block; font-family: "Cormorant Garamond", serif; font-size: 28px; font-weight: 400; line-height: 1; color: var(--violet-light); }
.count span { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
.week { font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--text3); margin: 22px 0 10px; cursor: pointer; }
details.wk > summary { list-style: none; }
details.wk > summary::-webkit-details-marker { display: none; }
details.wk > summary::before { content: '▸ '; }
details.wk[open] > summary::before { content: '▾ '; }
.day { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
.day-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
.day-title { font-size: 15px; font-weight: 500; text-transform: capitalize; }
.all { background: none; border: 1px solid var(--border); color: var(--violet-light); border-radius: 20px; font-family: inherit; font-size: 12px; padding: 5px 12px; cursor: pointer; }
.slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.slot { border-radius: 12px; border: 1.5px dashed var(--border); background: transparent; color: var(--text2); font-family: inherit; font-size: 16px; padding: 14px 8px; cursor: pointer; text-align: center; min-height: 54px; transition: transform .08s; }
.slot:active { transform: scale(.97); }
.slot small { display: block; font-size: 11px; color: var(--text3); margin-top: 1px; }
.slot.on { border: 1.5px solid var(--violet); background: linear-gradient(135deg, #4a3a7c, #6a4fa6); color: #fff; font-weight: 500; }
.slot.on small { color: #e4d8fb; }
.slot.booked { border: 1.5px solid var(--pink); background: var(--pink-bg); color: #ffd9e8; cursor: default; text-align: left; padding: 10px 12px; }
.slot.booked small { color: #f3c9dc; }
.empty { text-align: center; padding: 36px 16px; color: var(--text3); font-size: 14px; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px max(14px, env(safe-area-inset-bottom)); background: rgba(15,13,22,.96); border-top: 1px solid var(--border); display: none; }
.savebar.show { display: block; }
.savebar button { display: block; width: 100%; max-width: 648px; margin: 0 auto; border: 0; border-radius: 14px; padding: 16px; font-family: inherit; font-size: 17px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #6a4fa6, #9b7ddb); cursor: pointer; }
.savebar button:disabled { opacity: .6; }
.toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: #2d6a3f; color: #fff; padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: 500; z-index: 50; display: none; }
.month-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.month-nav button { background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: var(--text2); padding: 8px 14px; font-size: 14px; cursor: pointer; font-family: inherit; }
.month-label { font-family: "Cormorant Garamond", serif; font-size: 22px; flex: 1; }
.soin-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 14px; }
.soin-date { min-width: 52px; text-align: center; }
.soin-day { font-size: 24px; font-family: "Cormorant Garamond", serif; color: var(--violet-light); line-height: 1; }
.soin-month { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
.soin-name { font-size: 14px; font-weight: 500; }
.soin-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }
.soin-student { font-size: 13px; color: var(--text2); margin-top: 6px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 500; margin-left: 6px; }
.badge-included { background: rgba(163,230,53,.12); color: var(--green); }
.badge-paid { background: rgba(155,125,219,.15); color: var(--violet-light); }
.invoice { background: var(--card); border: 1px solid rgba(163,230,53,.25); border-radius: 16px; padding: 20px; margin-top: 24px; }
.invoice h3 { font-family: "Cormorant Garamond", serif; font-size: 20px; font-weight: 300; color: var(--green); margin-bottom: 12px; }
.invoice .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text2); }
.invoice .total { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 15px; font-weight: 500; }
.invoice .total b { font-family: "Cormorant Garamond", serif; font-size: 28px; color: var(--green); }
.spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--violet); border-radius: 50%; animation: spin .8s linear infinite; margin: 60px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap">
  <div class="header">
    <div class="avatar">A</div>
    <div><h1>Aude</h1><p>Soins Bien-être · Yely in the Air</p></div>
  </div>
  <div class="tabs">
    <button class="tab on" id="tab-slots" onclick="showTab('slots')">Mes créneaux</button>
    <button class="tab" id="tab-soins" onclick="showTab('soins')">Mes soins</button>
  </div>
  <div id="content"><div class="spinner"></div></div>
</div>
<div class="savebar" id="savebar"><button id="savebtn" onclick="save()">Valider mes choix</button></div>

<script>
const API = 'https://xayixasuyuranscustyw.supabase.co/functions/v1/aude-portal';
const T = new URLSearchParams(location.search).get('t') || '';
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let data = null, tab = 'slots', month = null;
const openWeeks = new Set();
function weekToggled(w, open) { if (!openWeeks.size) { document.querySelectorAll('details.wk[open]').forEach(d => {}); } open ? openWeeks.add(w) : openWeeks.delete(w); }
const changes = new Map();   // "date|HH:MM" -> 'validated' | 'proposed' (état voulu)

async function call(body) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: T, ...body }) });
  return { status: r.status, data: await r.json().catch(() => ({})) };
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2600); }
const key = s => s.date + '|' + s.time;
const label = t => t.replace(':00', 'h').replace(':', 'h');
function dayLabel(d) { return new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
function mondayOf(d) { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.toISOString().slice(0, 10); }
function weekLabel(m) { const a = new Date(m + 'T12:00:00'), b = new Date(a); b.setDate(a.getDate() + 6); const f = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); return `Semaine du ${f(a)} au ${f(b)}`; }

function effective(s) { return changes.has(key(s)) ? changes.get(key(s)) : s.status; }

function renderSlots() {
  const slots = data.slots;
  const on = slots.filter(s => effective(s) === 'validated').length;
  const off = slots.filter(s => effective(s) === 'proposed').length;
  const booked = slots.filter(s => s.status === 'booked').length;
  let html = '';
  if (!data.visibleToStudents) html += `<div class="banner">Pour l'instant, les élèves ne voient pas encore ces créneaux dans l'app : Ana activera la nouvelle réservation quand tu auras validé les tiens.</div>`;
  html += `<p class="intro">La salle Terre est libre sur ces horaires. <b>Coche ceux où tu veux accueillir des élèves</b> : seuls les créneaux que tu valides apparaissent dans l'app. Un soin dure 50 minutes.</p>`;
  html += `<div class="counts"><div class="count"><b>${on}</b><span>Validés</span></div><div class="count"><b>${off}</b><span>À valider</span></div><div class="count"><b>${booked}</b><span>Réservés</span></div></div>`;
  if (!slots.length) html += `<div class="empty">Aucun créneau proposé pour le moment.<br>Ils apparaissent automatiquement dès que la salle Terre est libre.</div>`;
  const byDay = {}, weeks = {};
  slots.forEach(s => { (byDay[s.date] = byDay[s.date] || []).push(s); });
  Object.keys(byDay).sort().forEach(d => { (weeks[mondayOf(d)] = weeks[mondayOf(d)] || []).push(d); });
  const weekKeys = Object.keys(weeks).sort();
  weekKeys.forEach((w, wi) => {
    const wSlots = weeks[w].flatMap(d => byDay[d]);
    const wOn = wSlots.filter(s => effective(s) === 'validated').length, wOff = wSlots.filter(s => effective(s) === 'proposed').length;
    const isOpen = openWeeks.size ? openWeeks.has(w) : wi === 0;
    html += `<details class="wk" ${isOpen ? 'open' : ''} ontoggle="weekToggled('${w}', this.open)"><summary class="week">${weekLabel(w)} <span style="text-transform:none;letter-spacing:0;font-weight:400">· ${wOn} validé${wOn > 1 ? 's' : ''}, ${wOff} à valider</span></summary>`;
    weeks[w].forEach(d => {
      const list = byDay[d];
      const free = list.filter(s => s.status !== 'booked');
      const allOn = free.length && free.every(s => effective(s) === 'validated');
      html += `<div class="day"><div class="day-head"><div class="day-title">${dayLabel(d)}</div>${free.length ? `<button class="all" onclick="toggleDay('${d}')">${allOn ? 'Tout décocher' : 'Tout cocher'}</button>` : ''}</div><div class="slots">`;
      list.forEach(s => {
        const k = key(s), end = String(parseInt(s.time) + 1).padStart(2, '0') + ':00';
        if (s.status === 'booked') {
          const b = s.booking || {};
          html += `<div class="slot booked">🔒 ${label(s.time)}–${label(end)}<small>Réservé · ${esc((b.name || '').split(' ')[0])}</small><small>${esc(b.type || '')}${b.included ? ' · inclus abo' : ''}</small></div>`;
        } else {
          const v = effective(s) === 'validated';
          html += `<button class="slot ${v ? 'on' : ''}" onclick="toggle('${k}')">${v ? '✓ ' : ''}${label(s.time)}–${label(end)}<small>${v ? 'Validé' : 'Pas encore validé'}</small></button>`;
        }
      });
      html += `</div></div>`;
    });
    html += `</details>`;
  });
  document.getElementById('content').innerHTML = html;
  const n = changes.size;
  document.getElementById('savebar').classList.toggle('show', n > 0);
  document.getElementById('savebtn').textContent = `Valider mes choix (${n} changement${n > 1 ? 's' : ''})`;
}

function original(k) { const s = data.slots.find(x => key(x) === k); return s ? s.status : null; }
function setState(k, v) { if (original(k) === v) changes.delete(k); else changes.set(k, v); }
function toggle(k) { const s = data.slots.find(x => key(x) === k); setState(k, effective(s) === 'validated' ? 'proposed' : 'validated'); renderSlots(); }
function toggleDay(d) {
  const free = data.slots.filter(s => s.date === d && s.status !== 'booked');
  const allOn = free.every(s => effective(s) === 'validated');
  free.forEach(s => setState(key(s), allOn ? 'proposed' : 'validated'));
  renderSlots();
}

async function save() {
  const btn = document.getElementById('savebtn'); btn.disabled = true; btn.textContent = 'Enregistrement…';
  const validate = [], release = [];
  changes.forEach((v, k) => { const [date, time] = k.split('|'); (v === 'validated' ? validate : release).push({ date, time }); });
  const { data: r } = await call({ op: 'save', validate, release });
  btn.disabled = false;
  if (!r.ok) { toast('Oups, réessaie dans un instant'); renderSlots(); return; }
  changes.clear();
  await load();
  toast(r.refused?.length ? 'Enregistré (certains créneaux sont déjà réservés)' : 'C\'est enregistré ✨');
}

function soinCard(s) {
  const d = new Date(s.date + 'T12:00:00');
  const badge = s.is_included ? '<span class="badge badge-included">Inclus abo</span>' : '<span class="badge badge-paid">40 €</span>';
  return `<div class="soin-card"><div class="soin-date"><div class="soin-day">${d.getDate()}</div><div class="soin-month">${MONTHS[d.getMonth()].slice(0, 3)}</div></div><div>
    <div class="soin-name">${esc(s.type)}${badge}</div><div class="soin-meta">${esc(s.start_time)} · 50 min</div>
    <div class="soin-student">👤 ${esc(s.student_name)}${s.student_phone ? ' · ' + esc(s.student_phone) : ''}</div>${s.notes ? `<div class="soin-meta" style="font-style:italic;margin-top:6px">${esc(s.notes)}</div>` : ''}</div></div>`;
}

function renderSoins() {
  const [y, m] = data.month.split('-').map(Number);
  const list = data.monthAppointments;
  const today = new Date().toISOString().slice(0, 10);
  const paid = list.filter(s => !s.is_included), inc = list.filter(s => s.is_included);
  let html = `<div class="month-nav"><button onclick="changeMonth(-1)">←</button><div class="month-label">${MONTHS[m - 1]} ${y}</div><button onclick="changeMonth(1)">→</button></div>`;
  html += `<div class="counts"><div class="count"><b>${list.length}</b><span>Soins</span></div><div class="count"><b>${paid.length}</b><span>Payants</span></div><div class="count"><b>${inc.length}</b><span>Inclus abo</span></div></div>`;
  if (!list.length) html += `<div class="empty">Aucun soin ce mois-ci</div>`;
  const up = list.filter(s => s.date >= today), past = list.filter(s => s.date < today);
  if (up.length) html += `<div class="week">À venir</div>` + up.map(soinCard).join('');
  if (past.length) html += `<div class="week">Passés</div>` + past.map(soinCard).join('');
  html += `<div class="invoice"><h3>🧾 Récapitulatif facturation</h3>` + (paid.length
    ? paid.map(s => { const d = new Date(s.date + 'T12:00:00'); return `<div class="row"><span>${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)} · ${esc(s.start_time)} · ${esc(s.type)}</span><span>40 €</span></div>`; }).join('') + `<div class="total"><span>Total à facturer à Yely in the Air</span><b>${paid.length * 40} €</b></div>`
    : `<div style="font-size:13px;color:var(--text3)">Aucun soin payant ce mois-ci</div>`)
    + (inc.length ? `<div style="font-size:11px;color:var(--text3);margin-top:10px">${inc.length} soin${inc.length > 1 ? 's' : ''} inclus dans un abonnement : non facturé${inc.length > 1 ? 's' : ''} à l'unité</div>` : '') + `</div>`;
  document.getElementById('content').innerHTML = html;
  document.getElementById('savebar').classList.remove('show');
}

async function changeMonth(d) { const [y, m] = month.split('-').map(Number); const x = new Date(Date.UTC(y, m - 1 + d, 1)); month = x.toISOString().slice(0, 7); await load(); }
function showTab(t) { tab = t; document.getElementById('tab-slots').classList.toggle('on', t === 'slots'); document.getElementById('tab-soins').classList.toggle('on', t === 'soins'); render(); }
function render() { if (tab === 'slots') renderSlots(); else renderSoins(); }

async function load() {
  const { status, data: d } = await call({ op: 'get', month });
  if (status !== 200) { document.getElementById('content').innerHTML = `<div class="empty">Ce lien n'est pas valide.<br>Ouvre l'espace depuis le dernier mail ou message d'Ana.</div>`; return false; }
  data = d; month = d.month; render(); return true;
}
if (!T) document.getElementById('content').innerHTML = `<div class="empty">Ouvre cette page depuis ton lien personnel.</div>`; else load();
</script>
</body>
</html>
